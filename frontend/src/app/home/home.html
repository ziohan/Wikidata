<div class="page">
  <header class="header">
    Wikidata
  </header>
  <div class="content">
    <div class="buttons">
      <button class="card-btn" (click)="goToSettings()">
        <span class="icon">⚙️</span>
        <span>Settings</span>
      </button>
      <button class="card-btn main" (click)="goToNewQuery()">
        <span class="icon">➕</span>
        <span>New Query</span>
      </button>
      <button class="card-btn" (click)="goToHistory()">
        <span class="icon">📄</span>
        <span>History</span>
      </button>
    </div>
  </div>
</div>
