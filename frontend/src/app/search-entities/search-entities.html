<div class="page">
  <h1>Search Entities</h1>
  <div class="filters">
    <input placeholder="Search QID or label" [(ngModel)]="search" (input)="load()" />
    <button class="star-btn" [class.active]="favorite" (click)="favorite = !favorite; load()">
      ⭐
    </button>
  </div>
  <table>
    <thead>
      <tr>
        <th (click)="toggleSort('qid')">QID ⬍</th>
        <th (click)="toggleSort('label')">Label ⬍</th>
        <th (click)="toggleSort('occurrences')">Occurrences ⬍</th>
        <th>Favorite</th>
        <th>Visualize</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let e of entities()">
        <td style="cursor:pointer" (click)="toggleSort('qid')">
          {{ e.qid }}
        </td>
        <td>
          {{ e.label }}
        </td>
        <td style="cursor:pointer" (click)="toggleSort('occurrences')">
          {{ e.occurrences }}
        </td>
        <td>
          <button class="fav-btn" (click)="toggleFavorite(e.qid)">
            {{ e.favorite ? '⭐' : '☆' }}
          </button>
        </td>

        <td>
          <button class="view-btn" (click)="visualize(e.qid)">
            🔍
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  
  <div class="pagination">
    <button (click)="changePage(page - 1)" [disabled]="page <= 1">
      ◀
    </button>
    <span>Page {{ page }}</span>
    <button (click)="changePage(page + 1)" [disabled]="entities().length < page_size">
      ▶
    </button>
  </div>
</div>
