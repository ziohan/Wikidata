<div class="page">
  <h1>Top Queries Dashboard</h1>
  <h2>Top Subjects</h2>
  <table>
    <tr>
      <th>QID</th>
      <th>Label</th>
      <th>Occurrences</th>
    </tr>
    <tr *ngFor="let s of subjects()">
      <td>{{ s.qid }}</td>
      <td>{{ s.label }}</td>
      <td>{{ s.occurrences }}</td>
    </tr>
  </table>
  <h2>Top Predicates</h2>
  <table>
    <tr>
      <th>PID</th>
      <th>Label</th>
      <th>Occurrences</th>
    </tr>
    <tr *ngFor="let p of predicates()">
      <td>{{ p.pid }}</td>
      <td>{{ p.label }}</td>
      <td>{{ p.occurrences }}</td>
    </tr>
  </table>
  <h2>Top Triplets</h2>
  <table>
    <tr>
      <th>Triplet</th>
      <th>Average Score</th>
      <th>Occurrences</th>
    </tr>
    <tr *ngFor="let t of triplets()">
      <td>{{ t.triple }}</td>
      <td>{{ t.avg_score }}</td>
      <td>{{ t.occurrences }}</td>
    </tr>
  </table>
</div>
