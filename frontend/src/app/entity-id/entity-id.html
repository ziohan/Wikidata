<div class="page">

  <h1>Entity: {{ qid }}</h1>
  <h2>Occurrences: {{ occurrences }}</h2>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Hops</th>
        <th>Date</th>
        <th>Expand</th>
        <th>Visualize</th>
      </tr>
    </thead>

    <tbody>
      <ng-container *ngFor="let q of queries()">

        <!-- MAIN ROW -->
        <tr>
          <td class="col-title">{{ q.title }}</td>
          <td>{{ q.hops }}</td>
          <td>{{ q.created_at | date:'dd/MM/yyyy HH:mm:ss' }}</td>
          
          <td>
            <button (click)="visualize(q.id)">
              🔍
            </button>
          </td>

          <td>
            <button (click)="toggle(q.id)">
              {{ expanded()[q.id] ? '▼' : '▶' }}
            </button>
          </td>
        </tr>

        <!-- SUB TABLE -->
        <tr *ngIf="expanded()[q.id]">
          <td colspan="5">
            <table class="sub-table">
              <thead>
                <tr>
                  <th>Triple</th>
                  <th>Subject</th>
                  <th>Predicate</th>
                  <th>Object</th>
                  <th>Score</th>
                </tr>
              </thead>

              <tbody>
                <tr *ngFor="let t of q.triples">
                  <td>{{ t.triple }}</td>
                  <td>{{ t.subject_qid }}</td>
                  <td>{{ t.predicate_pid }}</td>
                  <td>{{ t.object_qid }}</td>
                  <td>{{ t.score }}</td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>

      </ng-container>
    </tbody>
  </table>

</div>
